services:
  - type: web
    name: omnistream-media
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PREXZY_API_BASE_URL
        value: https://prexzyapis.com
      - key: ADMIN_PASSWORD
        value: 2810
